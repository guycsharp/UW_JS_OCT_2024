<!DOCTYPE html>
<html>
  <head>
    <title>To Do List</title>
    <link rel="stylesheet" href="jQueryToDoList.css" />
  </head>
  <body>
    <main>
      <h1>To Do:</h1>
      <ul id="todo-list">
        <li>
          <span>Reading</span>
          <a href="#" class="delete">Delete</a>
        </li>
        <li>
          <span>Homework</span>
          <a href="#" class="delete">Delete</a>
        </li>
      </ul>
      <div class="add">
        <input id="new-task" placeholder="New item" type="text" />
        <a href="#" id="add-item" class="add-item">Add</a>
      </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="jQueryToDoList.js"></script>
  </body>
</html>
